<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Rock Paper Scissors</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      text-align: center;
      margin-top: 50px;
    }
    h1 {
      font-size: 3em;
      color: #333;
    }
    button {
      padding: 15px 30px;
      margin: 10px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    #status {
      margin-top: 30px;
      font-size: 20px;
      color: #333;
    }
    #score {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }
    #winner {
      font-size: 36px;
      font-weight: bold;
      margin-top: 40px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Rock Paper Scissors</h1>
    <div>
      <button value="rock">Rock</button>
      <button value="paper">Paper</button>
      <button value="scissors">Scissors</button>
    </div>
    <div id="status"></div>
    <div id="score"></div>
    <div id="winner"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
